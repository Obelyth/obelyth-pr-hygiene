# Claude PR Review — caller. Rendered by obelyth-pr-hygiene/install.sh --review; edit the toolkit,
# not this file. Reviews every non-draft, human-authored, same-repo pull request once per push and
# prints the cost of each review in the job summary.
name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read

jobs:
  review:
    uses: Obelyth/obelyth-pr-hygiene/.github/workflows/claude-review.yml@main
    with:
      federation_rule_id: "__FEDERATION_RULE_ID__"   # one rule per GitHub account, pinned to the toolkit's workflow
