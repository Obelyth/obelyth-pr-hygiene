# Claude PR Review — caller. Copied from obelyth-pr-hygiene/templates/claude-review.caller.yml; edit
# the toolkit, not this file. Reviews every non-draft, human-authored, same-repo pull request once per push and
# prints the cost of each review in the job summary.
name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read

jobs:
  review:
    uses: Obelyth/obelyth-pr-hygiene/.github/workflows/claude-review.yml@main
    secrets: inherit   # CLAUDE_CODE_OAUTH_TOKEN: an org secret on Obelyth, a repo secret on ShootJackal repos
