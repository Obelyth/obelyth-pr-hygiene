name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shell scripts parse
        run: |
          shopt -s nullglob
          for f in scripts/*.sh install.sh tests/*.sh; do
            if [[ -f "$f" ]]; then bash -n "$f"; fi
          done

      - name: Shellcheck
        run: |
          shopt -s nullglob
          files=()
          for f in scripts/*.sh install.sh tests/*.sh; do
            if [[ -f "$f" ]]; then files+=("$f"); fi
          done
          (( ${#files[@]} )) || { echo "nothing to check yet"; exit 0; }
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck "${files[@]}"

      - name: Workflows are valid
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | bash -s -- latest "$RUNNER_TEMP"
          # actionlint's model of the github context predates
          # github.job_workflow_sha (the commit of a reusable workflow file,
          # documented by GitHub and used by pr-hygiene.yml to check out the
          # matching scripts), so that one report is ignored, not the check.
          "$RUNNER_TEMP/actionlint" -color \
            -ignore 'property "job_workflow_sha" is not defined in object type'
          # The caller template is a workflow too, once its placeholders are
          # filled in. Render it the way install.sh does and lint the result.
          if [[ -f templates/caller.template.yml ]]; then
            mkdir -p "$RUNNER_TEMP/render/.github/workflows"
            sed -e 's|__TOOLKIT_REPO__|Obelyth/obelyth-pr-hygiene|g' templates/caller.template.yml \
              > "$RUNNER_TEMP/render/.github/workflows/pr-hygiene.yml"
            "$RUNNER_TEMP/actionlint" -color "$RUNNER_TEMP/render/.github/workflows/pr-hygiene.yml"
          fi

      - name: Data files are valid
        run: |
          shopt -s nullglob
          for f in labels/*.json schema/*.json; do
            jq -e . "$f" > /dev/null
          done
          for f in templates/*.yml .github/release.yml .github/pr-hygiene.yml; do
            if [[ -f "$f" ]]; then yq -e . "$f" > /dev/null; fi
          done
          if [[ -f schema/pr-hygiene.schema.json ]]; then
            pipx install check-jsonschema > /dev/null
            for f in templates/pr-hygiene.yml .github/pr-hygiene.yml; do
              if [[ -f "$f" ]]; then check-jsonschema --schemafile schema/pr-hygiene.schema.json "$f"; fi
            done
          fi
          # This repository's own copies are the shipped templates, byte for byte.
          for pair in "release.yml release.yml" "pull_request_template.md pull_request_template.md" "pr-hygiene.yml pr-hygiene.yml"; do
            src="templates/${pair%% *}"; dst=".github/${pair#* }"
            if [[ -f "$src" && -f "$dst" ]]; then cmp "$src" "$dst"; fi
          done

      - name: Tests
        run: bash tests/hygiene_test.sh
