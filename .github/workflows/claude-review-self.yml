# This repository exercises the reusable review workflow from the commit under review.
# Pass only its existing subscription credential; no other caller secrets are inherited.
name: Claude PR Review (self)

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read

jobs:
  review:
    uses: ./.github/workflows/claude-review.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
