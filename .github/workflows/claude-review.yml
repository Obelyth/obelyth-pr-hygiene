# Claude PR Review — the reusable workflow
#
# One review job, called from a 15-line caller in each repository (templates/claude-review.caller.yml),
# so the prompt, the model, the turn cap and the cost line live in one place. Authentication is
# one of two, chosen by the caller. With a federation_rule_id it is workload identity
# federation: the rule in the Anthropic Console is pinned to THIS workflow file —
#   job_workflow_ref = Obelyth/obelyth-pr-hygiene/.github/workflows/claude-review.yml@refs/heads/main
#   event_name       = pull_request
#   subject          = repo:<account>@<account_id>/*
# — and the review bills the Console workspace. Without one it is the CLAUDE_CODE_OAUTH_TOKEN
# secret the caller passes with `secrets: inherit` (a subscription token from `claude
# setup-token`), and the review bills the subscription. Callers read the rule id from an Actions
# variable, so one variable per account decides which path the estate uses. Never both: the
# action prefers a static credential, so the token is withheld whenever a rule id is given.
# Every run prints what it cost in the job summary. See README, "Claude PR Review".
name: Claude PR Review

on:
  workflow_call:
    inputs:
      federation_rule_id:
        description: >-
          The Anthropic workload-identity federation rule for this GitHub account (fdrl_…).
          Empty means authenticate with the caller's CLAUDE_CODE_OAUTH_TOKEN secret instead.
        required: false
        type: string
        default: ""
      anthropic_organization_id:
        required: false
        type: string
        default: "90972ce6-7917-48d8-914f-5fc7dde67f9e"
      anthropic_service_account_id:
        required: false
        type: string
        default: "svac_018dtjjur2szezYx3BARMvKg"
      anthropic_workspace_id:
        required: false
        type: string
        default: "wrkspc_01X3oWfERuSwC2LsE5jzG8P1"
      model:
        description: Sonnet is the default; Opus is ~2.5x per token and adds little to a read-only review
        required: false
        type: string
        default: claude-sonnet-5
      max_turns:
        required: false
        type: number
        default: 12

jobs:
  review:
    # Drafts are not asking for review yet. A PR opened by a bot (dependabot's version bumps)
    # is one the action would refuse red rather than skip: it throws on any Bot actor not named
    # in allowed_bots. A fork PR carries no OIDC identity and cannot read secrets. Skip all three here,
    # visibly. The AUTHOR is what is tested, not the actor: the auto-fixer's push to a human's PR
    # fires this with actor github-actions[bot], admitted by allowed_bots below.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      # The OIDC token: exchanged twice, for the Anthropic credential (federation) and for the
      # Claude GitHub App's installation token that posts the comments.
      id-token: write
      actions: read # github.token backs the github_ci tools, which read the PR's CI runs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Review PR
        id: review
        uses: anthropics/claude-code-action@3b8197d3d486006dd4af54613517f21ac6ac625e # v1.0.227 (where v1 pointed on 2026-09-17)
        with:
          # One credential, never both: the action prefers a static credential over federation,
          # so the subscription token is passed only when the caller gave no rule id.
          claude_code_oauth_token: ${{ inputs.federation_rule_id == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          # Workload identity federation — identifiers, not secrets. One rule per GitHub
          # account, read by the caller from an Actions variable.
          anthropic_federation_rule_id: ${{ inputs.federation_rule_id }}
          anthropic_organization_id: ${{ inputs.anthropic_organization_id }}
          anthropic_service_account_id: ${{ inputs.anthropic_service_account_id }}
          anthropic_workspace_id: ${{ inputs.anthropic_workspace_id }}
          # The CI auto-fixer pushes to open PRs as github-actions[bot], and the action refuses
          # bot actors unless named here. Those pushes are the ones a reviewer most needs to see.
          allowed_bots: "github-actions[bot]"
          # Post each inline comment as Claude writes it, anchored to the head it was written
          # against. The default buffers them and replays the buffer in an always() step after
          # the session, which runs on cancellation too: a push that cancels a review mid-flight
          # would land the half-finished comments on the NEW head at the OLD line numbers.
          classify_inline_comments: "false"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request. The PR's merge with its base is checked out in the
            working directory. Before reading the diff, read whichever of these exist at the repo
            root and hold the PR to them: AGENTS.md, CLAUDE.md, CONTRIBUTING.md, README.md.

            Review in this priority order:

            1. Silent-failure paths. Any write, deploy, sync or send that can appear to succeed
               while doing nothing is the worst bug a codebase can have. Every changed path that
               has a side effect must surface a real result on success and fail loudly otherwise;
               every read of a degraded source must say so rather than return an empty result
               that reads as "nothing there". Trace each changed path and confirm this, or flag it.
            2. Secret handling. Flag anything that logs a credential, echoes one into an error
               response or a redirect, commits one (a test fixture, a workflow prompt and a
               .env.example with a real value all count), or weakens an existing auth check.
            3. Correctness. Logic errors, unhandled edge cases, broken error handling. Give a
               concrete failing input for every claim; do not raise a concern you cannot make
               fail.
            4. This repository's conventions.
               - Never bypass red CI. Flag any change that makes a gate pass without fixing the
                 cause: deleted or rewritten assertions, .skip or .todo, continue-on-error, a
                 removed CI step, --no-verify, or a parser or comparator loosened until an old
                 assertion holds. A test edited in the same PR as the code it guards needs its
                 reason in the diff. Read the PR's CI status (mcp__github_ci__get_ci_status)
                 before judging a change to a test or a gate.
               - Reuse. If the PR reinvents a function, component or pattern that already exists
                 in this repository, name the existing one.
               - Whatever the root documents above say is a rule of this repository is a rule
                 for this review.
            5. Tests. Is the changed behaviour actually covered? Flag tests that cannot fail: no
               assertion, asserting on the mock, expect(true), or a skip-when-absent that hides
               the very case the test exists for.

            Skip formatting and naming preferences unless they hurt readability.
            Do not praise. If there is nothing to fix, say so in one line.
            Use mcp__github_inline_comment__create_inline_comment for specific issues and one
            top-level comment (gh pr comment) for the summary. The review lives on GitHub: post
            it there, not in your final message.
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # What this review cost, from the action's own execution log: printed on every run so the
      # per-PR price is a measured number, never an estimate.
      - name: Report the review's cost
        if: always() && steps.review.outputs.execution_file != ''
        env:
          F: ${{ steps.review.outputs.execution_file }}
        run: |
          if [ -f "$F" ]; then
            RESULT=$(jq -c '[.[] | select(.type == "result")] | last // {}' "$F" 2>/dev/null || echo '{}')
            COST=$(echo "$RESULT" | jq -r '.total_cost_usd // "unknown"')
            TURNS=$(echo "$RESULT" | jq -r '.num_turns // "?"')
            MS=$(echo "$RESULT" | jq -r '.duration_ms // 0')
            printf 'Review cost: $%s over %s turns in %ss\n' "$COST" "$TURNS" "$((MS / 1000))"
            echo "::notice title=Review cost::\$${COST} over ${TURNS} turns in $((MS / 1000))s"
            {
              echo "### Review cost"
              echo
              echo "**\$${COST}** over ${TURNS} turns in $((MS / 1000))s (${{ inputs.federation_rule_id != '' && 'federation' || 'subscription' }}, ${{ inputs.model }}, max ${{ inputs.max_turns }} turns)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=Review cost::execution log not found; cost unknown"
          fi

      # The action exits 0 when the App token exchange refuses the workflow, which it does for
      # any PR whose copy of this file is not byte-identical to the default branch's — including
      # the PR that adds it. The action sets `conclusion` only once Claude has actually run, so
      # an empty one means no review happened. Green on purpose: the skip is structural for a PR
      # that edits this file and cannot be fixed from inside it.
      - name: Say so when no review ran
        if: steps.review.outputs.conclusion == ''
        run: |
          echo "::warning title=Claude review did not run::The action ended without running Claude, so this PR was NOT reviewed. If the PR edits .github/workflows/claude-review.yml that is expected: the Claude App token exchange refuses a workflow file that differs from the default branch's."
          {
            echo "### :warning: Claude review did not run"
            echo
            echo "The action ended without running Claude. Nothing was posted to the PR."
            echo
            echo "If this PR edits \`.github/workflows/claude-review.yml\` that is expected: the Claude App token exchange refuses a workflow file that is not byte-identical to the default branch's, and the first real review lands on the next PR after this one merges."
            echo
            echo "A green tick here means *not reviewed*, not *clean*."
          } >> "$GITHUB_STEP_SUMMARY"
